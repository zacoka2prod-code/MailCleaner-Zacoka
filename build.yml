
name: Build MailCleaner Windows and macOS

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build Windows application
        run: pyinstaller --noconfirm --clean "MailCleaner_Zacoka.spec"
      - name: Install Inno Setup
        run: choco install innosetup -y
      - name: Create Windows installer
        run: |
          mkdir release -Force
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\windows_installer.iss"
      - uses: actions/upload-artifact@v4
        with:
          name: MailCleaner-Windows-EXE
          path: release/MailCleaner_Zacoka_Setup_Windows.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build macOS application
        run: pyinstaller --noconfirm --clean "MailCleaner_Zacoka.spec"
      - name: Create DMG
        run: |
          mkdir -p release/dmg
          cp -R "dist/MailCleaner Zacoka.app" release/dmg/
          ln -s /Applications release/dmg/Applications
          hdiutil create \
            -volname "MailCleaner Zacoka" \
            -srcfolder release/dmg \
            -ov -format UDZO \
            "release/MailCleaner_Zacoka_macOS.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: MailCleaner-macOS-DMG
          path: release/MailCleaner_Zacoka_macOS.dmg
